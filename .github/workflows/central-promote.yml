name: Central Multi-Repo Branch Promotion

on:
  workflow_dispatch:
    inputs:
      repository:
        type: choice
        description: 'Select the repository to promote'
        required: true
        options:
          - 'palashroy/maf-test-1'
          - 'palashroy/maf-test-2'
      environment:
        type: choice
        description: 'Select the promotion environment'
        required: true
        options:
          - 'Promote dev to qa'
          - 'Promote qa to release'

jobs:
  determine-branches:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.set-branches.outputs.source }}
      target: ${{ steps.set-branches.outputs.target }}
    steps:
      - id: set-branches
        run: |
          if [ "${{ github.event.inputs.environment }}" = "Promote dev to qa" ]; then
            echo "source=dev" >> $GITHUB_OUTPUT
            echo "target=qa" >> $GITHUB_OUTPUT
          else
            echo "source=qa" >> $GITHUB_OUTPUT
            echo "target=release" >> $GITHUB_OUTPUT
          fi

  call-promotion:
    needs: determine-branches
    # References the local reusable workflow file within the same repo
    uses: ./.github/workflows/reusable-promotion.yml
    with:
      repository: ${{ github.event.inputs.repository }}
      source_branch: ${{ needs.determine-branches.outputs.source }}
      target_branch: ${{ needs.determine-branches.outputs.target }}
    secrets:
      # Store a PAT or GitHub App installation token in your central repo secrets
      PROMOTION_TOKEN: ${{ secrets.CENTRAL_CROSS_REPO_PAT }}
