name: Central Multi-Repo Branch Promotion

on:
  workflow_dispatch:
    inputs:
      # Individual repository checkboxes
      repo_maf_test_1:
        type: boolean
        description: 'Promote palashroy/maf-test-1'
        default: false
      repo_maf_test_2:
        type: boolean
        description: 'Promote palashroy/maf-test-2'
        default: false
      
      # Environment Dropdown
      environment:
        type: choice
        description: 'Select the promotion environment'
        required: true
        options:
          - 'Promote dev to qa'
          - 'Promote qa to release'

jobs:
  evaluate-inputs:
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.vars.outputs.source }}
      target_branch: ${{ steps.vars.outputs.target }}
      selected_repos: ${{ steps.repos.outputs.matrix }}
    steps:
      # 1. Determine Source and Target Branches
      - id: vars
        run: |
          if [ "${{ inputs.environment }}" = "Promote dev to qa" ]; then
            echo "source=dev" >> $GITHUB_OUTPUT
            echo "target=qa" >> $GITHUB_OUTPUT
          else
            echo "source=qa" >> $GITHUB_OUTPUT
            echo "target=release" >> $GITHUB_OUTPUT
          fi

      # 2. Build a valid COMPACT JSON array of ONLY the selected checkboxes
      - id: repos
        run: |
          REPOS_JSON="[]"
          
          if [ "${{ inputs.repo_maf_test_1 }}" = "true" ]; then
            REPOS_JSON=$(echo $REPOS_JSON | jq -c '. + ["palashroy/maf-test-1"]')
          fi
          if [ "${{ inputs.repo_maf_test_2 }}" = "true" ]; then
            REPOS_JSON=$(echo $REPOS_JSON | jq -c '. + ["palashroy/maf-test-2"]')
          fi
          
          echo "Final Selected Repos: $REPOS_JSON"
          
          # Guard clause: Fail the workflow if no repositories were selected
          if [ "$REPOS_JSON" = "[]" ]; then
            echo "::error::You must select at least one repository to promote."
            exit 1
          fi
          
          echo "matrix=$REPOS_JSON" >> $GITHUB_OUTPUT

  call-promotion:
    needs: evaluate-inputs
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.evaluate-inputs.outputs.selected_repos) }}
    # References your Reusable Workflow
    uses: palashroy/central-devops-repo-1/.github/workflows/reusable-promotion.yml@main
    with:
      repository: ${{ matrix.repository }}
      source_branch: ${{ needs.evaluate-inputs.outputs.source_branch }}
      target_branch: ${{ needs.evaluate-inputs.outputs.target_branch }}
    secrets:
      PROMOTION_TOKEN: ${{ secrets.CENTRAL_CROSS_REPO_PAT }}
