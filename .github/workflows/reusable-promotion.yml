name: Reusable Branch Promotion

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
        description: 'The target repository to run the promotion on (e.g., owner/repo)'
      target_branch:
        required: true
        type: string
        description: 'The branch to promote TO (qa or release)'
      source_branch:
        required: true
        type: string
        description: 'The branch to promote FROM (dev or qa)'
    secrets:
      PROMOTION_TOKEN:
        required: true
        description: 'A PAT with write access to target repositories'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the specific repo passed from the matrix using your PAT
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_TOKEN }}

      # 2. Configure Git Identity
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      # 3. Execute branch promotion safely
      - name: Promote Branch
        run: |
          echo "Promoting ${{ inputs.source_branch }} into ${{ inputs.target_branch }} for ${{ inputs.repository }}..."
          
          # Force fetch all remote tracking branches
          git fetch origin
          
          # Checkout target branch and bring it up to date
          git checkout ${{ inputs.target_branch }}
          git pull origin ${{ inputs.target_branch }}
          
          # Attempt a fast-forward merge from the remote tracking source branch
          git merge --ff-only origin/${{ inputs.source_branch }}
          
          # Push changes up to target remote branch
          git push origin ${{ inputs.target_branch }}
